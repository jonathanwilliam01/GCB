<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>GCB - Gestão e Controle do Bebê</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="GCB - sono, janelas de vigília, alimentação e medidas do bebê" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GCB" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      try {
        const t = localStorage.getItem('gcb:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        const n = localStorage.getItem('gcb:appName');
        if (n) {
          document.title = n;
          addEventListener('DOMContentLoaded', () => (document.getElementById('splash-name').textContent = n));
        }
      } catch {}
    </script>
  </head>
  <body>
    <app-root>
      <div style="min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; font-family: system-ui, sans-serif">
        <img src="icon.svg" width="96" height="96" alt="" />
        <b id="splash-name" style="font-size: 22px; color: #6a5ae0">GCB</b>
      </div>
    </app-root>
    <noscript>Ative o JavaScript para usar o GCB.</noscript>
  </body>
</html>
